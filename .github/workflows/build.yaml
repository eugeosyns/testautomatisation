name: Flutter Build

on:
  push:
    branches: [main]

env:
  FLUTTER_VERSION: '3.38.1'

jobs:
# ─────────────────────────────────────────────
# JOB 1 — Version bump + Build Android
# ─────────────────────────────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ☕ Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # ─────────────────────────────────────────
      # IMPORTANT : créer le .env AVANT
      # flutter pub get sinon le build plante
      # car .env est déclaré dans les assets
      # ─────────────────────────────────────────
      - name: 🔐 Créer le fichier .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: 📦 Installer les dépendances
        run: flutter pub get

      - name: 🔢 Incrémenter la version
        id: version
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo $CURRENT | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $CURRENT | cut -d'+' -f2)
          MAJOR=$(echo $VERSION_NAME | cut -d'.' -f1)
          MINOR=$(echo $VERSION_NAME | cut -d'.' -f2)
          PATCH=$(echo $VERSION_NAME | cut -d'.' -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_BUILD=$((BUILD_NUMBER + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}+${NEW_BUILD}"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version : $CURRENT → $NEW_VERSION"

      - name: 🔨 Build Android App Bundle
        run: flutter build appbundle --release

      - name: 📤 Sauvegarder le .aab
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.version.outputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: 💾 Sauvegarder la version dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: version bump → ${{ steps.version.outputs.version }} [skip ci]"
          git push

# ─────────────────────────────────────────────
# JOB 2 — Build iOS
# ─────────────────────────────────────────────
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: build-android

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Même ordre : .env AVANT flutter pub get
      - name: 🔐 Créer le fichier .env
        run: echo "${{ secrets.ENV_FILE }}" > .env

      - name: 📦 Installer les dépendances
        run: flutter pub get

      - name: 🔨 Build iOS (sans signature)
        run: flutter build ios --release --no-codesign

      - name: 📦 Créer le .ipa non signé
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload/

      - name: 📤 Sauvegarder le .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.build-android.outputs.version }}
          path: Runner.ipa
          retention-days: 30