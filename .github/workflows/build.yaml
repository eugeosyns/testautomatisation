name: Flutter Build

on:
  push:
    branches: [main]

env:
  FLUTTER_VERSION: '3.38.1'

jobs:
# ─────────────────────────────────────────────
# JOB 1 — Auto version + Build Android
# ─────────────────────────────────────────────
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: ☕ Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Installer les dépendances
        run: flutter pub get

      # ─────────────────────────────────────────
      # AUTO VERSION — incrémente le build number
      # ex: 1.0.0+5 → 1.0.0+6
      # ─────────────────────────────────────────
      - name: 🔢 Incrémenter la version
        id: version
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          VERSION_NAME=$(echo $CURRENT | cut -d'+' -f1)
          BUILD_NUMBER=$(echo $CURRENT | cut -d'+' -f2)
          NEW_BUILD=$((BUILD_NUMBER + 1))
          NEW_VERSION="${VERSION_NAME}+${NEW_BUILD}"
          sed -i "s/^version: .*/version: $NEW_VERSION/" pubspec.yaml
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "✅ Version : $CURRENT → $NEW_VERSION"

      - name: 🔨 Build Android App Bundle
        run: flutter build appbundle --release

      - name: 📤 Sauvegarder le .aab
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.version.outputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ─────────────────────────────────────────
      # Commit le pubspec.yaml mis à jour
      # [skip ci] évite une boucle infinie
      # ─────────────────────────────────────────
      - name: 💾 Sauvegarder la version dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: version bump → ${{ steps.version.outputs.version }} [skip ci]"
          git push

# ─────────────────────────────────────────────
# JOB 2 — Build iOS
# Vous faites ensuite : git pull → Xcode → Archive
# ─────────────────────────────────────────────
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    # Attend que Android soit fini (et que le version bump soit commité)
    needs: build-android

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4
        with:
          # Récupère le dernier commit (avec le version bump)
          ref: main

      - name: 🐦 Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📦 Installer les dépendances
        run: flutter pub get

      - name: 🔨 Build iOS (sans signature)
        run: flutter build ios --release --no-codesign

      # ─────────────────────────────────────────
      # On sauvegarde le dossier Runner.app compilé
      # Vous faites git pull → Xcode voit le build
      # prêt → Archive → App Store Connect
      # ─────────────────────────────────────────
      - name: 📦 Créer le .ipa non signé
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Runner.ipa Payload/

      - name: 📤 Sauvegarder le .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ needs.build-android.outputs.version }}
          path: Runner.ipa
          retention-days: 30